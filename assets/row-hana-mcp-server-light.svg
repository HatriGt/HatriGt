<svg xmlns="http://www.w3.org/2000/svg" width="880" height="88" viewBox="0 0 880 88">
<style>
.r{opacity:0;animation:in .7s 0.15s ease-out forwards} @keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.ic path,.ic rect,.ic ellipse{stroke-dasharray:80;stroke-dashoffset:80;animation:dr 1.4s 0.35s ease-out forwards} @keyframes dr{to{stroke-dashoffset:0}}
.rule{transform-origin:0 0;transform:scaleX(0);animation:sx 1s 0.15s ease-out forwards} @keyframes sx{to{transform:scaleX(1)}}
.ar{animation:nudge 2.2s 2.0s ease-in-out infinite} @keyframes nudge{0%,70%,100%{transform:none}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="r">
