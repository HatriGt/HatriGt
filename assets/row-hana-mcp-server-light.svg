 <text x="64" y="37" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="24" fill="#1f2328">hana-mcp-server</text>
 <text x="64" y="63" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#3d444d">MCP server for SAP HANA and HANA Cloud — schema discovery and guarded SQL for AI clients.</text>
