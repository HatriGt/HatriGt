<svg xmlns="http://www.w3.org/2000/svg" width="320" height="230" viewBox="0 0 320 230">
<defs><linearGradient id="grad" x1="0" x2="1"><stop offset="0" stop-color="#ff6a3d"/><stop offset=".5" stop-color="#ff2d8a"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#f5f7fb"/><stop offset=".45" stop-color="#f5f7fb"/><stop offset=".5" stop-color="#fff"/><stop offset=".55" stop-color="#f5f7fb"/><stop offset="1" stop-color="#f5f7fb"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f1a"/><stop offset="1" stop-color="#05070d"/></linearGradient>
<radialGradient id="tglow" cx=".1" cy=".05" r=".8"><stop offset="0" stop-color="#ff6a3d" stop-opacity=".35"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></radialGradient>
<linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a3d"/><stop offset=".6" stop-color="#1c2333"/><stop offset="1" stop-color="#1c2333"/></linearGradient>
<clipPath id="c"><rect width="320" height="230" rx="18"/></clipPath>
<style>.in{opacity:0;animation:in .8s 0.6s cubic-bezier(.2,.8,.2,1) forwards}@keyframes in{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.ic path,.ic rect,.ic ellipse{stroke-dasharray:90;stroke-dashoffset:90;animation:dr 1.4s 0.8999999999999999s ease-out forwards}@keyframes dr{to{stroke-dashoffset:0}}
.sh{animation:sh 5s 1.7999999999999998s ease-in-out infinite}@keyframes sh{0%,100%{transform:translateX(-340px)}60%,100%{transform:translateX(340px)}}
.ar{animation:ar 2.4s 1.6s ease-in-out infinite}@keyframes ar{0%,70%,100%{transform:none}80%{transform:translate(3px,-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<g class="in" clip-path="url(#c)">
<rect width="320" height="230" rx="18" fill="url(#tg)"/><rect width="320" height="230" fill="url(#tglow)"/>
<rect class="sh" x="0" y="0" width="80" height="230" fill="#fff" opacity=".05" transform="skewX(-20)"/>
<rect x=".75" y=".75" width="318.5" height="228.5" rx="17.5" fill="none" stroke="url(#border)" stroke-width="1.5"/>
<rect x="24" y="24" width="46" height="46" rx="12" fill="#05070d" stroke="#1c2333"/>
<g class="ic" transform="translate(35 35)" fill="none" stroke="#ff6a3d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"><path d="M6 2v16h16M2 6h16v16"/></g>
<g class="ar"><text x="296" y="46" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#ff6a3d">↗</text></g>
<text x="24" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f5f7fb" letter-spacing="-.3">Beautiful screenshots, instantly</text>
<text x="24" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8b93a7">Client-side beautifier &amp; annotator.</text>
<text x="24" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8b93a7">Nothing leaves the browser.</text>
<text x="24" y="201" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#ff6a3d">screenxshot</text>
<circle cx="223.0" cy="197" r="4" fill="#f1e05a"/><text x="296" y="201" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#8b93a7">JavaScript</text>
</g></svg>