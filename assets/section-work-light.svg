<filter id="glow2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter><style>.u{opacity:0;animation:u .8s ease-out forwards}@keyframes u{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
