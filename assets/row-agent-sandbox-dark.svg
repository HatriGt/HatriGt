<svg xmlns="http://www.w3.org/2000/svg" width="880" height="88" viewBox="0 0 880 88">
<style>
.r{opacity:0;animation:in .7s 0.39s ease-out forwards} @keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.ic path,.ic rect,.ic ellipse{stroke-dasharray:80;stroke-dashoffset:80;animation:dr 1.4s 0.5900000000000001s ease-out forwards} @keyframes dr{to{stroke-dashoffset:0}}
.rule{transform-origin:0 0;transform:scaleX(0);animation:sx 1s 0.39s ease-out forwards} @keyframes sx{to{transform:scaleX(1)}}
.ar{animation:nudge 2.2s 2.6s ease-in-out infinite} @keyframes nudge{0%,70%,100%{transform:none}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="r">
 <rect x="0" y="16" width="44" height="44" rx="10" fill="#161b22" stroke="#30363d"/>
 <g class="ic" transform="translate(10 26)" fill="none" stroke="#e8805a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 20.5 7v10L12 21.5 3.5 17V7Z M3.5 7 12 11.5 20.5 7M12 11.5v10"/></g>
 <text x="64" y="37" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="24" fill="#f0f3f6">agent-sandbox</text>
 <text x="64" y="63" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#c9d1d9">Disposable sandboxes for coding agents. Delegate the task, keep the control.</text>
 <text x="852" y="36" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#7d8590">TypeScript</text>
 <g class="ar"><text x="880" y="36" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e8805a">→</text></g>
</g>
<rect class="rule" x="0" y="87" width="880" height="1" fill="#30363d"/>
</svg>