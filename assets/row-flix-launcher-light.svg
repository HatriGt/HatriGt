<svg xmlns="http://www.w3.org/2000/svg" width="880" height="88" viewBox="0 0 880 88">
<style>
.r{opacity:0;animation:in .7s 0.63s ease-out forwards} @keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.ic path,.ic rect,.ic ellipse{stroke-dasharray:80;stroke-dashoffset:80;animation:dr 1.4s 0.8300000000000001s ease-out forwards} @keyframes dr{to{stroke-dashoffset:0}}
.rule{transform-origin:0 0;transform:scaleX(0);animation:sx 1s 0.63s ease-out forwards} @keyframes sx{to{transform:scaleX(1)}}
.ar{animation:nudge 2.2s 3.2s ease-in-out infinite} @keyframes nudge{0%,70%,100%{transform:none}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="r">
 <rect x="0" y="16" width="44" height="44" rx="10" fill="#f6f8fa" stroke="#d8dee4"/>
 <g class="ic" transform="translate(10 26)" fill="none" stroke="#b5431b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="13" rx="2"/><path d="M8 21h8M9 2l3 3 3-3"/></g>
 <text x="64" y="37" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="24" fill="#1f2328">flix-launcher</text>
 <text x="64" y="63" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#3d444d">A quiet Android TV launcher. Home is one click from what you’re watching.</text>
 <text x="852" y="36" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#6e7781">Kotlin</text>
 <g class="ar"><text x="880" y="36" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#b5431b">→</text></g>
</g>
<rect class="rule" x="0" y="87" width="880" height="1" fill="#d8dee4"/>
</svg>