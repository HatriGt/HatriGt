<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200">
<defs><linearGradient id="grad" x1="0" x2="1"><stop offset="0" stop-color="#ff6a3d"/><stop offset=".5" stop-color="#ff2d8a"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#f5f7fb"/><stop offset=".45" stop-color="#f5f7fb"/><stop offset=".5" stop-color="#fff"/><stop offset=".55" stop-color="#f5f7fb"/><stop offset="1" stop-color="#f5f7fb"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter><clipPath id="c"><rect width="1000" height="200" rx="18"/></clipPath>
<radialGradient id="n" cx="1" cy="0" r=".7"><stop offset="0" stop-color="#ff2d8a" stop-opacity=".3"/><stop offset="1" stop-color="#ff2d8a" stop-opacity="0"/></radialGradient>
<style>.t{opacity:0;animation:t .9s ease-out forwards}@keyframes t{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.q{font-family:Georgia,serif;font-size:120px;fill:url(#grad);opacity:.25}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<g clip-path="url(#c)"><rect width="1000" height="200" fill="#0b0f1a"/><rect width="1000" height="200" fill="url(#n)"/>
<text class="q" x="28" y="120">“</text>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#f5f7fb">
<text class="t" x="90" y="70" font-size="21" font-weight="600" style="animation-delay:.1s">Most of my day is spent on SAP BTP: CAP services, HANA Cloud and Cloud Foundry.</text>
<text class="t" x="90" y="104" font-size="17" fill="#8b93a7" style="animation-delay:.3s">Lately that means MCP servers and agent infrastructure — the plumbing that lets an LLM do real work</text>
<text class="t" x="90" y="130" font-size="17" fill="#8b93a7" style="animation-delay:.4s">against enterprise systems without being dangerous. Off the clock I shoot photos and edit in Lightroom.</text>
<text class="t" x="90" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#ff6a3d" style="animation-delay:.6s">OPEN TO COLLABORATING ON SAP × AI TOOLING</text>
</g><rect x=".5" y=".5" width="999" height="199" rx="18" fill="none" stroke="#1c2333"/></g></svg>